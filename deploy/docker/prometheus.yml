# Prometheus configuration for Carbon-Aware Deep Reinforcement Learning Platform

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
  
  # Carbon-Aware Controller metrics
  - job_name: "carbon-aware-controller"
    scrape_interval: 30s
    metrics_path: "/metrics"
    static_configs:
      - targets: ["controller:8000"]
        labels:
          service: "controller"
          environment: "development"
  
  # Optional: Node exporter for host metrics
  # - job_name: "node-exporter"
  #   static_configs:
  #     - targets: ["node-exporter:9100"]